name: F2 MCP checks
on:
  push:
    branches: ['f2/**']
  pull_request:
permissions:
  contents: read
jobs:
  mcp-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Smoke test health and unauthorized MCP
        run: |
          PROJECTOS_MCP_TOKEN='projectos-test-token-not-for-production-123456789' npm run start -- --port 3100 > /tmp/projectos-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/health > /tmp/projectos-health.json; then break; fi
            sleep 2
          done
          grep -q '"status":"ok"' /tmp/projectos-health.json
          HTTP_CODE="$(curl -s -o /tmp/projectos-denied.json -w '%{http_code}' -X POST http://127.0.0.1:3100/mcp -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')"
          test "$HTTP_CODE" = "401"
          MCP_CODE="$(curl -s -o /tmp/projectos-tools.json -w '%{http_code}' -X POST http://127.0.0.1:3100/mcp \
            -H 'Authorization: Bearer projectos-test-token-not-for-production-123456789' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2025-06-18' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')"
          test "$MCP_CODE" = "200"
          grep -q 'projectos.list_skills' /tmp/projectos-tools.json
          grep -q 'projectos.get_skill' /tmp/projectos-tools.json
