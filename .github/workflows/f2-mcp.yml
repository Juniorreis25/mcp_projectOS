name: F2 MCP checks
on:
  push:
    branches: ['f2/**']
  pull_request:
permissions:
  contents: read
jobs:
  mcp-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
