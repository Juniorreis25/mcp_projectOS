name: Bootstrap F1 lockfile
on:
  workflow_dispatch:
  push:
    branches: ['f1/reproducible-build-and-quality']
permissions:
  contents: write
jobs:
  lockfile:
    if: github.ref == 'refs/heads/f1/reproducible-build-and-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit exact dependency lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: add verified npm lockfile"
            git push origin HEAD:f1/reproducible-build-and-quality
          fi
